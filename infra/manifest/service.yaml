# https://kubernetes.io/docs/concepts/services-networking/service/
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: bn256-portfolio
  labels:
    app: bn256-portfolio
    component: frontend
spec:
  selector:
    app: bn256-portfolio
    component: frontend
  type: ClusterIP
  ports:
    - name: frontend
      protocol: TCP
      port: 80
      targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: bn256-portfolio
  labels:
    app: bn256-portfolio
    component: backend
spec:
  selector:
    app: bn256-portfolio
    component: backend
  type: ClusterIP
  ports:
    - name: backend
      protocol: TCP
      port: 80
      targetPort: 8080
